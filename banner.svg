<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Karthik Sethuraman — cybersecurity, systems, AI">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- midnight base + atmosphere -->
  <rect width="840" height="200" rx="12" fill="#07111F"/>
  <rect width="840" height="200" rx="12" fill="url(#grid)"/>
  <rect width="840" height="200" rx="12" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="48" y="80" fill="#64FFDA" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="14" letter-spacing="4">CYBERSECURITY · SYSTEMS · AI</text>
  <rect x="48" y="90" width="44" height="2" fill="#64FFDA" opacity="0.6"/>

  <!-- name -->
  <text x="48" y="136" fill="#E6EDF3" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.5">Karthik Sethuraman</text>

  <!-- supporting line -->
  <text x="48" y="166" fill="#8FA1B3" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="13">security-focused software — systems · infrastructure · AI</text>

  <!-- signal path motif -->
  <g>
    <path d="M560 96 H660 V148 H768" fill="none" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="560" cy="96" r="3.5" fill="#64FFDA"/>
    <circle cx="608" cy="96" r="2.2" fill="#8FA1B3" fill-opacity="0.6"/>
    <circle cx="660" cy="148" r="2.2" fill="#8FA1B3" fill-opacity="0.6"/>
    <circle cx="768" cy="148" r="3.5" fill="#64FFDA"/>
  </g>

  <!-- bottom accent edge -->
  <rect x="0" y="197" width="260" height="3" rx="1.5" fill="url(#edge)"/>
</svg>
